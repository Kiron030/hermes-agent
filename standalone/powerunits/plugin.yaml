name: powerunits
version: 0.1.0
description: >
  Standalone PowerUnits bounded-read plugin. Calls existing Repo-B
  /internal/hermes/bounded/v1 routes through one generic client.
  No URL, host, path, or SQL parameter is exposed to the model.
kind: standalone
author: PowerUnits
provides_tools:
  - read_powerunits_coverage_snapshot_v1
  - inventory_powerunits_bounded_coverage_v1
  - read_powerunits_entsoe_bzn_price_readiness_v1
  - readiness_powerunits_option_d_bounded_window
requires_env:
  - name: POWERUNITS_INTERNAL_EXECUTE_BASE_URL
    description: HTTPS origin of the bounded Repo-B API (no path).
    secret: false
  - name: POWERUNITS_INTERNAL_EXECUTE_ALLOWED_HOSTS
    description: Comma-separated exact host allowlist for the Base URL.
    secret: false
  - name: POWERUNITS_HERMES_INTERNAL_EXECUTE_SECRET
    description: Shared bearer for the bounded Repo-B API.
    secret: true
